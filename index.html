<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Study Hub</title>
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
</head>
<body>
<!-- Sidebar Navigation -->
<nav id="sidebar" class="sidebar">
  <div class="sidebar-header">
    <h2>📚 Study Hub</h2>
    <button id="sidebar-close" class="btn-icon">✕</button>
  </div>
  <div class="sidebar-search">
    <input type="text" id="search-input" placeholder="Search tools..." autocomplete="off">
  </div>
  <div class="sidebar-nav" id="nav-container"></div>
  <div class="sidebar-footer">
    <span>v1.0 • Offline Ready</span>
  </div>
</nav>

<!-- Main Content -->
<div class="app-container">
  <header class="topbar">
    <button id="sidebar-toggle" class="btn-icon">☰</button>
    <h1 id="page-title">Home</h1>
    <div class="topbar-actions">
      <button id="theme-toggle" class="btn-icon" title="Toggle theme">🌙</button>
    </div>
  </header>

  <main id="content" class="content"></main>

  <footer class="footer">
    <span>Student Study Hub • All tools are free & run 100% offline • Built with ❤️ for students</span>
  </footer>
</div>

<!-- Scripts -->
<script src="js/router.js"></script>
<script src="js/theme.js"></script>
<script src="js/nav.js"></script>
<script src="js/storage.js"></script>
<script src="js/home.js"></script>
<!-- Tool modules -->
<script src="js/tools/gpa.js"></script>
<script src="js/tools/scientific-calc.js"></script>
<script src="js/tools/unit-converter.js"></script>
<script src="js/tools/pomodoro.js"></script>
<script src="js/tools/flashcards.js"></script>
<script src="js/tools/schedule.js"></script>
<script src="js/tools/assignment-tracker.js"></script>
<script src="js/tools/exam-countdown.js"></script>
<script src="js/tools/periodic-table.js"></script>
<script src="js/tools/formula-ref.js"></script>
<script src="js/tools/cheatsheets.js"></script>
<script src="js/tools/code-playground.js"></script>
<script src="js/tools/regex-tester.js"></script>
<script src="js/tools/json-formatter.js"></script>
<script src="js/tools/base64.js"></script>
<script src="js/tools/color-picker.js"></script>
<script src="js/tools/citation-gen.js"></script>
<script src="js/tools/word-counter.js"></script>
<script src="js/tools/budget.js"></script>
<script src="js/tools/water-tracker.js"></script>
<script src="js/tools/sleep-calc.js"></script>
<script src="js/tools/mind-map.js"></script>
<script src="js/tools/todo.js"></script>
<script src="js/tools/notes.js"></script>
<script src="js/tools/habit-tracker.js"></script>
<script src="js/tools/eye-exercise.js"></script>
<script src="js/tools/readability.js"></script>
<script src="js/tools/tables.js"></script>
<script src="js/tools/physics-constants.js"></script>
<!-- App init -->
<script src="js/app.js"></script>
</body>
</html>
